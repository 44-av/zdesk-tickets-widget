<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Zoho Desk - Apps</title>
    <link rel="stylesheet" href="/app/css/index.css" />
  </head>

  <body>
    <!---Parent Ticket-->
    <div class="ticket-card" id="parentCard">
      <h3 class="card-title">Parent Ticket</h3>
      <div class="separator"></div>

      <div class="ticket-row">
        <div class="col left">
          <p class="visit">Client Visit</p>

          <p class="id-name">
            <span data-p="ticketNumber">#GEN-518</span> ·
            <span data-p="name">Ariane Villalino</span>
          </p>

          <p class="meta" data-p="created">
            Created On: <span class="ticketData">19 Jan 9:32 AM</span>
          </p>
        </div>

        <div class="col middle">
          <p class="meta" data-p="due">
            Due:<span class="ticketData">29 Jan 9:32 AM</span>
          </p>
          <p class="status" data-p="status">
            Status: <span class="ticketData">Open</span>
          </p>
        </div>

        <div class="col right">
          <p class="meta" data-p="department">
            Department: <span class="ticketData">GTE</span>
          </p>
          <p class="meta" data-p="owner">
            Owner: <span class="ticketData">GTE</span>
          </p>
        </div>
      </div>
    </div>

    <!---Peer Children Ticket-->
    <div class="ticket-card" id="peerChildContainer">
      <h3 class="card-title">Peer Child Ticket</h3>
      <div class="separator"></div>

      <!-- TEMPLATE (hidden, used for cloning) -->
      <!--style="display:none"-->
      <div class="ticket-row child-template">
        <div class="col left">
          <p class="visit">Client Visit</p>

          <p class="id-name">
            <span data-c="ticketNumber">#</span> ·
            <span data-c="name">Name</span>
          </p>

          <p class="meta" data-c="created">Created On:</p>
        </div>

        <div class="col middle">
          <p class="meta" data-c="due">Due:</p>
          <p class="status" data-p="status">
            Status: <span class="status-color"></span>
          </p>
        </div>

        <div class="col right">
          <p class="meta" data-c="department">Department:</p>
          <p class="meta" data-c="owner">Owner:</p>
        </div>
      </div>
<p class="no-child-text" style="display:none; font-style: italic; color: #555;">
    No Child Ticket
  </p>
    </div>

    <script src="https://js.zohostatic.com/support/developer_sdk/v1/js/ZohoDeskClientSDK.min.js"></script>
    <script>
      window.onload = function () {
  ZOHODESK.extension.onload().then(() => {
    // Fetch parent ticket
    ZOHODESK.get("ticket")
      .then((res) => {
        const ticket = res.ticket;
        const mappedParent = mapTicket(ticket);
        const isParent = ticket.cf?.cf_is_parent_ticket;
        console.log("IS Parent: "+isParent);
        const parentDiv = document.getElementById("parentCard");
        if (isParent) {
          // hide parent div
          parentDiv.style.display = "none";
        } else {
          // show and render parent ticket
          parentDiv.style.display = "flex"; 
          renderParent(mappedParent);
        }
        console.log("RAW: ",ticket);
        // Determine child ticket (mock or real ID)
        const childTicketId = ticket.cf?.cf_child_ticket_id;

        if (childTicketId) {
          // In local testing, use a mock child
          const mockChildTicket = {
            ticketNumber: "GEN-999",
            contact: { firstName: "John Doe" },
            createdTime: new Date(),
            dueDate: new Date(Date.now() + 86400000),
            status: "Open",
            department: { name: "Support" },
            assignee: { name: "Agent X" }
          };

          renderChild(mockChildTicket); // render the child
        } else {
          showNoChildText(); // show "No Child Ticket"
        }
      })
      .catch((err) => {
        console.log("Error fetching parent ticket:", err);
        showNoChildText(); // optional: show message if parent fails
      });
  });
};

    function getParentTicket(){
      
    }
      // Fetch child ticket using Zoho connector
      function getChildTicket(ticketId) {
        console.log("Fetching child ticket:", ticketId);

        const requestObj = {
          url: `/api/v1/tickets/${ticketId}`, // relative URL for widgets
          type: "get", // must be lowercase
          headers: { "Content-Type": "application/json" },
          connectionLinkName: "desk_api",
        };

        ZOHODESK.request(requestObj)
          .then((res) => {
            if (!res) {
              console.log("No data returned for child ticket");
              return;
            }
            const mappedChild = mapTicket(res);
            //renderChild(mappedChild);
            const mockChildTicket = {
            ticketNumber: "GEN-999",
            contact: { firstName: "John Doe" },
            createdTime: new Date(),
            dueDate: new Date(Date.now() + 86400000),
            status: "Open",
            department: { name: "Support" },
            assignee: { name: "Agent X" }
          };

          renderChild(mockChildTicket);

          })
          .catch((err) => {
            console.log("Error fetching child ticket:", err);
          });
      }

      // --- Render functions ---
      function renderParent(t) {
        setText("[data-p='ticketNumber']", `#${t.ticketNumber}`);
        setText("[data-p='name']", t.contact?.firstName || "—");
        setText("[data-p='created'] .ticketData", formatDate(t.createdTime));
        setText("[data-p='due'] .ticketData", formatDate(t.dueDate));

        const statusSpan = document.querySelector(
          "[data-p='status'] .ticketData",
        );
        statusSpan.textContent = t.status || "—";
        statusSpan.className = "status-badge";
        statusSpan.style.color = getStatusColor(t.status);

        setText("[data-p='department'] .ticketData", t.department?.name || "—");
        setText("[data-p='owner'] .ticketData", t.assignee?.name || "—");
      }

      function renderChild(t) {
        const container = document.getElementById("peerChildContainer");
        const template = container.querySelector(".child-template");
        const emptyText = container.querySelector(".no-child-text");

        if (emptyText) emptyText.style.display = "none";
        if (!t) return;

        const clone = template.cloneNode(true);
        clone.classList.remove("child-template");
        clone.style.display = "flex";

        clone.querySelector("[data-c='ticketNumber']").textContent =
          `#${t.ticketNumber}`;
        clone.querySelector("[data-c='name']").textContent =
          t.contact?.firstName || "—";
        clone.querySelector("[data-c='created']").textContent =
          "Created On: " + formatDate(t.createdTime);
        clone.querySelector("[data-c='due']").textContent =
          "Due: " + formatDate(t.dueDate);
        clone.querySelector("[data-c='department']").textContent =
          "Department: " + (t.department?.name || "—");
        clone.querySelector("[data-c='owner']").textContent =
          "Owner: " + (t.assignee?.name || "—");

        const statusEl = clone.querySelector(".status-color");
        statusEl.textContent = t.status || "—";
        statusEl.className = "status-badge";
        statusEl.style.backgroundColor = getStatusColor(t.status);

        container.appendChild(clone);
      }

      // --- Helpers ---
      function mapTicket(ticket) {
        return {
          ticketNumber: ticket.number,
          contact: { firstName: ticket.contactName },
          createdTime: ticket.createdTime,
          dueDate: ticket.dueDate,
          status: ticket.status,
          department: { name: ticket.departmentId },
          assignee: { name: ticket.ownerName || ticket.owner },
        };
      }

      function showNoChildText() {
        const container = document.getElementById("peerChildContainer");
        const emptyText = container.querySelector(".no-child-text");
        if (emptyText) emptyText.style.display = "block";
      }

      function setText(selector, text) {
        const el = document.querySelector(selector);
        if (el) el.textContent = text;
      }

      function getStatusColor(status) {
        const colors = {
          Closed: "#e74c3c",
          "In Progress": "#3498db",
          Open: "#2ecc71",
          "On Hold": "#e67e22",
          Escalated: "#f1c40f",
        };
        return colors[status] || "#7f8c8d";
      }

      function formatDate(dateInput) {
        if (!dateInput) return "—";
        return new Date(dateInput)
          .toLocaleString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true,
          })
          .replace(",", "");
      }
    
    </script>
  </body>
</html>
