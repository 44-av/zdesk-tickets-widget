<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Zoho Desk - Apps</title>

  <body>
    <!---Parent Ticket-->
    <div class="ticket-card" id="parentCard">
      <h3 class="card-title">Parent Ticket</h3>
      <div class="separator"></div>

      <div class="ticket-row">
        <div class="col left">
          <p class="visit">Client Visit</p>

          <p class="id-name">
            <span data-p="ticketNumber">#GEN-518</span> ·
            <span data-p="name">Ariane Villalino</span>
          </p>

          <p class="meta" data-p="created">Created On: 19 Jan 9:32 AM</p>
        </div>

        <div class="col middle">
          <p class="meta" data-p="due">Due: 29 Jan 9:32 AM</p>
          <p class="status open" data-p="status">Status: Open</p>
        </div>

        <div class="col right">
          <p class="meta" data-p="department">Department: Warehouse</p>
          <p class="meta" data-p="owner">Owner: Agent 1</p>
        </div>
      </div>
    </div>

    <!---Peer Children Ticket-->
    <div class="ticket-card" id="peerChildContainer">
  <h3 class="card-title">Peer Child Ticket</h3>
  <div class="separator"></div>

  <!-- TEMPLATE (hidden, used for cloning) -->
   <!--style="display:none"-->
  <div class="ticket-row child-template">
    <div class="col left">
      <p class="visit">Client Visit</p>

      <p class="id-name">
        <span data-c="ticketNumber">#</span> ·
        <span data-c="name">Name</span>
      </p>

      <p class="meta" data-c="created">Created On:</p>
    </div>

    <div class="col middle">
      <p class="meta" data-c="due">Due:</p>
      <p class="status open" data-c="status">Status:</p>
    </div>

    <div class="col right">
      <p class="meta" data-c="department">Department:</p>
      <p class="meta" data-c="owner">Owner:</p>
    </div>
  </div>
</div>
